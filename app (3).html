<title>ListaFácil - Sua Lista. Suas Compras. Suas Contas.</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f1115;
    color: #e8e8e8;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px;
  }
  .app {
    width: 100%;
    max-width: 420px;
  }
  h1 {
    font-size: 1.4rem;
    text-align: center;
    margin-bottom: 16px;
    font-weight: 600;
  }
  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 18px;
  }
  .brand img {
    width: 84px;
    height: 84px;
    margin-bottom: 6px;
  }
  .brand .brand-name {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .brand .brand-name .fac { color: #2e9e5b; }
  .brand .tagline {
    font-size: 0.72rem;
    color: #9aa0aa;
    letter-spacing: 0.5px;
    margin-top: 2px;
    text-transform: uppercase;
  }
  .backup-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .backup-btn {
    flex: 1;
    background: #1a1d24;
    border: 1px solid #2a2e37;
    color: #c8ccd4;
    padding: 10px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }
  .backup-btn:active { background: #22262f; }
  .tabs {
    display: flex;
    background: #1a1d24;
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 20px;
  }
  .tab-btn {
    flex: 1;
    padding: 10px;
    border: none;
    background: transparent;
    color: #9aa0aa;
    font-size: 0.95rem;
    font-weight: 600;
    border-radius: 9px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab-btn.active {
    background: #4f7cff;
    color: #fff;
  }
  .panel { display: none; }
  .panel.active { display: block; }

  /* Finanças */
  .balance-box {
    background: #1a1d24;
    border-radius: 16px;
    padding: 28px 20px;
    text-align: center;
    margin-bottom: 16px;
  }
  .balance-label {
    color: #9aa0aa;
    font-size: 0.9rem;
    margin-bottom: 4px;
  }
  .balance-value {
    font-size: 2.6rem;
    font-weight: 700;
    color: #4f7cff;
    margin-bottom: 12px;
  }
  .balance-sub {
    display: flex;
    justify-content: center;
    gap: 20px;
    font-size: 0.85rem;
    color: #9aa0aa;
  }
  .sub-income b { color: #2e9e5b; }
  .sub-expense b { color: #d1495b; }

  .fin-add-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  .fin-add-row input[type="text"] {
    flex: 2 1 140px;
  }
  .fin-add-row input[type="number"] {
    flex: 1 1 90px;
  }
  .fin-add-row input,
  .fin-add-row select {
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #2a2e37;
    background: #1a1d24;
    color: #e8e8e8;
    font-size: 0.95rem;
  }
  .fin-add-row select {
    flex: 1 1 100px;
  }
  .fin-add-row input:focus,
  .fin-add-row select:focus { outline: 1px solid #4f7cff; }
  .fin-add-row button {
    background: #4f7cff;
    border: none;
    color: #fff;
    padding: 0 20px;
    border-radius: 10px;
    font-size: 1.3rem;
    cursor: pointer;
    flex: 0 0 auto;
  }
  ul#fin-list {
    list-style: none;
  }
  ul#fin-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #1a1d24;
    padding: 12px 14px;
    border-radius: 10px;
    margin-bottom: 8px;
  }
  ul#fin-list li .fin-desc {
    flex: 1;
    word-break: break-word;
  }
  ul#fin-list li .fin-value {
    font-weight: 700;
    white-space: nowrap;
  }
  ul#fin-list li .fin-value.income { color: #2e9e5b; }
  ul#fin-list li .fin-value.expense { color: #d1495b; }
  ul#fin-list li button.del-btn {
    background: transparent;
    border: none;
    color: #6a6f7a;
    font-size: 1.2rem;
    cursor: pointer;
    padding: 4px 8px;
  }

  /* Lista de mercado */
  .add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .add-row input[type="text"] {
    flex: 2 1 140px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #2a2e37;
    background: #1a1d24;
    color: #e8e8e8;
    font-size: 1rem;
  }
  .add-row input[type="number"] {
    flex: 0 0 70px;
    padding: 12px 10px;
    border-radius: 10px;
    border: 1px solid #2a2e37;
    background: #1a1d24;
    color: #e8e8e8;
    font-size: 1rem;
    text-align: center;
  }
  .add-row input:focus { outline: 1px solid #4f7cff; }
  .add-row button {
    background: #4f7cff;
    border: none;
    color: #fff;
    padding: 0 20px;
    border-radius: 10px;
    font-size: 1.3rem;
    cursor: pointer;
  }
  ul#market-list {
    list-style: none;
  }
  ul#market-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #1a1d24;
    padding: 12px 14px;
    border-radius: 10px;
    margin-bottom: 8px;
  }
  ul#market-list li.done span.item-text {
    text-decoration: line-through;
    color: #6a6f7a;
  }
  ul#market-list li input[type="checkbox"] {
    width: 20px;
    height: 20px;
    cursor: pointer;
    accent-color: #4f7cff;
  }
  ul#market-list li span.item-text {
    flex: 1;
    word-break: break-word;
  }
  ul#market-list li span.item-qty {
    background: #2a2e37;
    color: #9aa0aa;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  ul#market-list li button.del-btn {
    background: transparent;
    border: none;
    color: #d1495b;
    font-size: 1.2rem;
    cursor: pointer;
    padding: 4px 8px;
  }
  .empty-msg {
    text-align: center;
    color: #6a6f7a;
    padding: 30px 0;
    font-size: 0.95rem;
  }
  .summary {
    text-align: center;
    color: #6a6f7a;
    font-size: 0.85rem;
    margin-top: 10px;
  }
</style>
</head>

    <div class="brand-name">Lista<span class="fac">Fácil</span></div>
    <div class="tagline">Sua lista. Suas compras. Suas contas.</div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="finance">Finanças</button>
    <button class="tab-btn" data-tab="market">Lista de Mercado</button>
  </div>

  <!-- Painel Finanças -->
  <div id="finance" class="panel active">
    <div class="balance-box">
      <div class="balance-label">Saldo</div>
      <div class="balance-value" id="balance-value">R$ 0,00</div>
      <div class="balance-sub">
        <span class="sub-income">Entradas: <b id="total-income">R$ 0,00</b></span>
        <span class="sub-expense">Saídas: <b id="total-expense">R$ 0,00</b></span>
      </div>
    </div>

    <div class="fin-add-row" id="fin-form">
      <input type="text" id="fin-desc" placeholder="Descrição" onkeydown="if(event.key==='Enter')addTransaction()">
      <input type="number" id="fin-value" placeholder="Valor" step="0.01" min="0" onkeydown="if(event.key==='Enter')addTransaction()">
      <select id="fin-type">
        <option value="income">Entrada</option>
        <option value="expense">Saída</option>
      </select>
      <button type="button" onclick="addTransaction()">+</button>
    </div>

    <ul id="fin-list"></ul>
    <div id="fin-empty" class="empty-msg">Nenhuma movimentação ainda</div>
  </div>

  <!-- Painel Lista de Mercado -->
  <div id="market" class="panel">
    <div class="add-row">
      <input type="text" id="market-input" placeholder="Adicionar item..." onkeydown="if(event.key==='Enter')addItem()">
      <input type="number" id="market-qty" placeholder="Qtd" min="1" value="1" onkeydown="if(event.key==='Enter')addItem()">
      <button onclick="addItem()">+</button>
    </div>
    <ul id="market-list"></ul>
    <div id="market-empty" class="empty-msg">Sua lista está vazia</div>
    <div class="summary" id="market-summary"></div>
  </div>
</div>

<script>
  // ----- Tabs -----
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
    });
  });

  // ----- Finanças -----
  let transactions = []; // { id, desc, value, type }
  let nextFinId = 1;

  function formatBRL(v) {
    return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  function addTransaction() {
    const descInput = document.getElementById('fin-desc');
    const valueInput = document.getElementById('fin-value');
    const typeInput = document.getElementById('fin-type');

    const desc = descInput.value.trim();
    const value = parseFloat(valueInput.value);
    const type = typeInput.value;

    if (!desc || isNaN(value) || value <= 0) return;

    transactions.push({ id: nextFinId++, desc, value, type });
    descInput.value = '';
    valueInput.value = '';
    typeInput.value = 'income';
    descInput.focus();
    renderFinance();
    autoSave();
  }

  function deleteTransaction(id) {
    transactions = transactions.filter(t => t.id !== id);
    renderFinance();
    autoSave();
  }

  function renderFinance() {
    const list = document.getElementById('fin-list');
    const empty = document.getElementById('fin-empty');
    list.innerHTML = '';

    if (transactions.length === 0) {
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      // mais recentes primeiro
      [...transactions].reverse().forEach(t => {
        const li = document.createElement('li');

        const desc = document.createElement('span');
        desc.className = 'fin-desc';
        desc.textContent = t.desc;

        const value = document.createElement('span');
        value.className = 'fin-value ' + t.type;
        value.textContent = (t.type === 'income' ? '+ ' : '- ') + formatBRL(t.value);

        const delBtn = document.createElement('button');
        delBtn.className = 'del-btn';
        delBtn.textContent = '✕';
        delBtn.onclick = () => deleteTransaction(t.id);

        li.appendChild(desc);
        li.appendChild(value);
        li.appendChild(delBtn);
        list.appendChild(li);
      });
    }

    const totalIncome = transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.value, 0);
    const totalExpense = transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.value, 0);
    const balance = totalIncome - totalExpense;

    document.getElementById('total-income').textContent = formatBRL(totalIncome);
    document.getElementById('total-expense').textContent = formatBRL(totalExpense);
    document.getElementById('balance-value').textContent = formatBRL(balance);
  }

  // ----- Lista de Mercado -----
  let items = []; // { id, text, done }
  let nextId = 1;

  function addItem() {
    const input = document.getElementById('market-input');
    const qtyInput = document.getElementById('market-qty');
    const text = input.value.trim();
    let qty = parseInt(qtyInput.value, 10);
    if (!text) return;
    if (isNaN(qty) || qty < 1) qty = 1;
    items.push({ id: nextId++, text, qty, done: false });
    input.value = '';
    qtyInput.value = '1';
    input.focus();
    renderList();
    autoSave();
  }

  function toggleItem(id) {
    const item = items.find(i => i.id === id);
    if (item) item.done = !item.done;
    renderList();
    autoSave();
  }

  function deleteItem(id) {
    items = items.filter(i => i.id !== id);
    renderList();
    autoSave();
  }

  function renderList() {
    const list = document.getElementById('market-list');
    const empty = document.getElementById('market-empty');
    const summary = document.getElementById('market-summary');
    list.innerHTML = '';

    if (items.length === 0) {
      empty.style.display = 'block';
      summary.textContent = '';
      return;
    }
    empty.style.display = 'none';

    items.forEach(item => {
      const li = document.createElement('li');
      if (item.done) li.classList.add('done');

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = item.done;
      checkbox.onchange = () => toggleItem(item.id);

      const span = document.createElement('span');
      span.className = 'item-text';
      span.textContent = item.text;

      const qtyBadge = document.createElement('span');
      qtyBadge.className = 'item-qty';
      qtyBadge.textContent = 'x' + item.qty;

      const delBtn = document.createElement('button');
      delBtn.className = 'del-btn';
      delBtn.textContent = '✕';
      delBtn.onclick = () => deleteItem(item.id);

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(qtyBadge);
      li.appendChild(delBtn);
      list.appendChild(li);
    });

    const doneCount = items.filter(i => i.done).length;
    summary.textContent = `${doneCount} de ${items.length} concluídos`;
  }

  // ----- Auto-save (memória do navegador do aparelho) -----
  const STORAGE_KEY = 'listafacil-dados';

  function autoSave() {
    try {
      const data = { transactions, nextFinId, items, nextId };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (err) {
      // se não conseguir salvar (ex: dentro do preview do Claude), ignora silenciosamente
    }
  }

  function autoLoad() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (Array.isArray(data.transactions)) transactions = data.transactions;
      if (typeof data.nextFinId === 'number') nextFinId = data.nextFinId;
      if (Array.isArray(data.items)) items = data.items;
      if (typeof data.nextId === 'number') nextId = data.nextId;
    } catch (err) {
      // ignora se não conseguir ler
    }
  }

  autoLoad();
  renderFinance();
  renderList();
</script>

</body>
</html>
